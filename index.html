<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Master Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/906/906334.png">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/906/906334.png">

    <style>
  
        :root { --primary: #2563eb; --bg: #8fafc; --card: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border: 1px solid var(--border); margin-bottom: 20px; box-sizing: border-box; }
        h2 { margin: 0 0 20px 0; font-size: 1.2rem; text-align: center; color: var(--primary); letter-spacing: 0.5px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: #64748b; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--primary); }
        button#addBtn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button#addBtn:active { transform: scale(0.98); }
        
        /* Task List */
        .task-list { width: 100%; max-width: 400px; }
        .task-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); transition: 0.3s; }
        .task-info { display: flex; flex-direction: column; }
        .task-name { font-weight: 600; font-size: 1rem; color: #334155; }
        .task-time { font-size: 0.85rem; color: #64748b; margin-top: 2px; }
        .delete-btn { background: #fee2e2; color: #ef4444; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        .delete-btn:hover { background: #fecaca; }
    </style>
</head>
<body onclick="enableNotif()">

<div class="container">
    <h2>NEW TASK</h2>
    <div class="input-group">
        <label>Task Title</label>
        <input type="text" id="taskInput" placeholder="Enter task...">
    </div>
    <div class="input-group">
        <label>Time</label>
        <input type="time" id="taskTime">
    </div>
    <button id="addBtn" onclick="addTask()">Schedule Task</button>
</div>

<div class="task-list" id="taskList"></div>

<script>
    let tasks = JSON.parse(localStorage.getItem('saved_tasks')) || [];

    // Register Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(reg => {
            console.log("Ready");
        });
    }

    function enableNotif() {
        if (Notification.permission === 'default') {
            Notification.requestPermission();
        }
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        tasks.sort((a, b) => a.time.localeCompare(b.time));
        tasks.forEach((t, i) => {
            list.innerHTML += `
                <div class="task-item">
                    <div class="task-info">
                        <span class="task-name">${t.name}</span>
                        <span class="task-time">🕒 ${t.time}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${i})">Delete</button>
                </div>
            `;
        });
    }

    function addTask() {
        const name = document.getElementById('taskInput').value;
        const time = document.getElementById('taskTime').value;
        
        if (!name || !time) return alert("Fill all fields");
        if (Notification.permission !== 'granted') return alert("Enable Notification First!");

        const id = Date.now();
        const newTask = { id, name, time };
        tasks.push(newTask);
        localStorage.setItem('saved_tasks', JSON.stringify(tasks));
        
        // Timer calculation
        const [h, m] = time.split(':');
        const target = new Date();
        target.setHours(h, m, 0);
        let delay = target.getTime() - new Date().getTime();
        if (delay < 0) delay += 24 * 60 * 60 * 1000;

        // Message to SW
        if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({
                type: 'SCHEDULE', task: name, delay: delay, id: id
            });
        }

        renderTasks();
        document.getElementById('taskInput').value = '';
    }

    function deleteTask(i) {
        tasks.splice(i, 1);
        localStorage.setItem('saved_tasks', JSON.stringify(tasks));
        renderTasks();
    }

    renderTasks();
</script>
</body>
</html>
